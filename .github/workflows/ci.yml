name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # 把 event_name 纳入分组：否则"手动触发的打包"会被随便一次 push 取消
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# 说明：本账号目前分配不到 macOS runner（job 在 1s 内被取消、0 步，连只跑 `uname -a`
# 的探针 job 也一样），属于 GitHub 计费/额度层面的限制，与代码无关。
# macOS 任务因此由仓库变量控制，默认关闭：
#   Settings → Secrets and variables → Actions → Variables → 新建 ENABLE_MACOS_CI = true
# 关闭期间 macOS 侧靠本地交叉检查：
#   ~/.cargo/bin/cargo check -p disklens-core --tests --target aarch64-apple-darwin

jobs:
  # 已确认可用的两个平台，跑真实测试（不只编译）
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
          - platform: windows-latest
            name: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: linux webkit deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: rust tests (core)
        run: cargo test -p disklens-core
      - name: frontend checks
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

  test-macos:
    if: vars.ENABLE_MACOS_CI == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: macos
      - name: rust tests (core)
        run: cargo test -p disklens-core
      - name: frontend checks
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

  # 安装包构建（个人自用：不签名、不发布 release，仅上传 artifact）
  # 只在打 tag 或手动触发时跑，避免日常 push 消耗额度
  build:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x86_64
            args: ""
          - platform: windows-latest
            name: windows-x86_64
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.name }}
      - name: linux webkit deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: install frontend deps
        working-directory: app
        run: npm ci
      - name: build
        # tauri-cli 只在含 tauri.conf.json 的目录（仓库根下的 src-tauri 的上级=根）工作，
        # 因此从仓库根调用 app/ 里的 cli，不能用 working-directory: app
        run: ./app/node_modules/.bin/tauri build ${{ matrix.args }}
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: disklens-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe

  build-macos:
    needs: test
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && vars.ENABLE_MACOS_CI == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: macos-aarch64
      - name: install frontend deps
        working-directory: app
        run: npm ci
      - name: build
        run: ./app/node_modules/.bin/tauri build --target aarch64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: ""
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: disklens-macos-aarch64
          if-no-files-found: warn
          retention-days: 30
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
