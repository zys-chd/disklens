name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 三平台跑同一套测试：不仅验证能编译，更要验证行为（路径/分隔符/权限语义各不相同）
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
          - platform: windows-latest
            name: windows
          - platform: macos-14
            name: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: linux webkit deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: rust tests (core)
        run: cargo test -p disklens-core
      - name: frontend checks
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

  # 三平台制品构建（个人自用：不签名、不发布 release，仅上传 artifact）
  # 只在打 tag 或手动触发时跑：macOS runner 计费 10x，避免日常 push 烧光免费额度
  build:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x86_64
            args: ""
          - platform: windows-latest
            name: windows-x86_64
            args: ""
          - platform: macos-14
            name: macos-aarch64
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.name }}
      - name: linux webkit deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: install frontend deps
        working-directory: app
        run: npm ci
      - name: build
        # tauri-cli 只在含 tauri.conf.json 的目录（这里是仓库根下的 src-tauri 的上级=根）工作，
        # 因此从仓库根调用 app/ 里的 cli，不能用 working-directory: app
        run: ./app/node_modules/.bin/tauri build ${{ matrix.args }}
        env:
          # 未配置签名证书：构建产物为未签名包（个人自用）
          APPLE_SIGNING_IDENTITY: ""
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: disklens-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
