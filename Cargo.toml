[workspace]
members = ["crates/disklens-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# 规则匹配的热点在 globset/regex；debug 测试也要有可比的性能
[profile.dev.package.globset]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
thiserror = "2"
trash = "5"
dirs = "6"
globset = "0.4"
tempfile = "3"
